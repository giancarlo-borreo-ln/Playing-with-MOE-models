# Model manifest shared by the VM runner (run_model.sh, CPU) and the host GPU
# runner (../gpu-run.sh, RTX 3060).
#
# Format (pipe separated, spaces allowed inside a field):
#   alias | company | size | huggingface repo | gguf filename | cpu flags | gpu flags
#
# All models are Q4_K_M GGUF. The flag columns are tuned per model:
#   CPU flags: sized for a 10 GB / ~6-8 vCPU VM (flash-attn + q8_0 KV cache
#              to fit more context in RAM).
#   GPU flags: -ngl tuned for a 6 GB RTX 3060. If you get a CUDA OOM, lower
#              -ngl; if it fits with room to spare, raise it toward 99.
#
deepseek-8b|DeepSeek|8B|unsloth/DeepSeek-R1-0528-Qwen3-8B-GGUF|DeepSeek-R1-0528-Qwen3-8B-Q4_K_M.gguf|-c 8192 -fa on -ctk q8_0 -ctv q8_0|-ngl 28 -c 4096 -fa on -ctk q8_0 -ctv q8_0
deepseek-14b|DeepSeek|14B|bartowski/DeepSeek-R1-Distill-Qwen-14B-GGUF|DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf|-c 4096 -fa on -ctk q8_0 -ctv q8_0|-ngl 10 -c 4096 -fa on -ctk q8_0 -ctv q8_0
qwen-14b|Alibaba|14B|Qwen/Qwen3-14B-GGUF|Qwen3-14B-Q4_K_M.gguf|-c 4096 -fa on -ctk q8_0 -ctv q8_0|-ngl 12 -c 4096 -fa on -ctk q8_0 -ctv q8_0
llama-8b|Meta|8B|bartowski/Meta-Llama-3.1-8B-Instruct-GGUF|Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf|-c 8192 -fa on -ctk q8_0 -ctv q8_0|-ngl 30 -c 4096 -fa on -ctk q8_0 -ctv q8_0
mistral-7b|Mistral|7B|bartowski/Mistral-7B-Instruct-v0.3-GGUF|Mistral-7B-Instruct-v0.3-Q4_K_M.gguf|-c 8192 -fa on -ctk q8_0 -ctv q8_0|-ngl 99 -c 4096 -fa on -ctk q8_0 -ctv q8_0
gemma-9b|Google|9B|bartowski/gemma-2-9b-it-GGUF|gemma-2-9b-it-Q4_K_M.gguf|-c 8192 -fa on -ctk q8_0 -ctv q8_0|-ngl 24 -c 4096 -fa on -ctk q8_0 -ctv q8_0
